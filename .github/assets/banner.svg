<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="I love you, and you are going to do great things">
  <defs>
    <!-- The site's cream base with the same subtle dot texture as the app -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#5D4E37" opacity="0.10"/>
      <circle cx="12" cy="12" r="0.7" fill="#5D4E37" opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F5E6D3" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#FFF8E7"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#fade)"/>
  <rect x="8" y="8" width="1184" height="404" rx="24" fill="none" stroke="#5D4E37" stroke-opacity="0.18" stroke-width="2"/>

