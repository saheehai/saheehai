name: Deploy frontend

# Fires only when frontend code actually changes, so a backend-only commit
# does not rebuild and re-upload the site.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'news/**'
      - 'resources/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Never let two deploys race to the same bucket.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify deploy configuration
        env:
          API_ENDPOINT: ${{ vars.API_ENDPOINT }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=0
          for v in API_ENDPOINT TURNSTILE_SITE_KEY COGNITO_USER_POOL_ID COGNITO_CLIENT_ID \
                   S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Build
        working-directory: frontend
        env:
          CI: true
          REACT_APP_API_ENDPOINT: ${{ vars.API_ENDPOINT }}
          REACT_APP_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          REACT_APP_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          REACT_APP_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-frontend-${{ github.run_id }}

      - name: Upload hashed assets
        # Content-hashed filenames, so they can be cached indefinitely.
        # Uploaded BEFORE any HTML so the new HTML never references an
        # asset that has not landed yet. Everything that is not hashed is
        # excluded here and uploaded below with a short cache.
        working-directory: frontend
        run: |
          aws s3 sync build/ "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "__pages/*" \
            --exclude "news/*" \
            --exclude "resources/*" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt" \
            --exclude "*.map"

      - name: Upload news and resources
        # Not content-hashed, so never immutable: a browser that cached a
        # post for a year would never see a correction to it.
        working-directory: frontend
        run: |
          for folder in news resources; do
            aws s3 sync "build/$folder/" "s3://${{ vars.S3_BUCKET }}/$folder/" \
              --delete \
              --exclude "*" --include "*.json" \
              --cache-control "public,max-age=300,must-revalidate" \
              --content-type "application/json"
          done
          aws s3 cp build/sitemap.xml "s3://${{ vars.S3_BUCKET }}/sitemap.xml" \
            --cache-control "public,max-age=3600" --content-type "application/xml"
          aws s3 cp build/robots.txt "s3://${{ vars.S3_BUCKET }}/robots.txt" \
            --cache-control "public,max-age=3600" --content-type "text/plain"

      - name: Upload per-route HTML
        # scripts/prerender.js writes one HTML file per public route under
        # build/__pages/, named like the URL path with "/" spelled "__"
        # (news__2026-09-16-back-online). Each is uploaded to the key the URL
        # names, so S3 serves /help from the object "help" with no redirect.
        # Same no-cache rule as index.html: these point at the new hashes.
        working-directory: frontend
        run: |
          for f in build/__pages/*; do
            key=$(basename "$f" | sed 's#__#/#g')
            aws s3 cp "$f" "s3://${{ vars.S3_BUCKET }}/$key" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "text/html"
          done

      - name: Upload index.html
        # Never cached: this is the file that points at the new asset hashes.
        working-directory: frontend
        run: |
          aws s3 cp build/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $id created; waiting for completion."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$id"

      - name: Smoke test
        run: |
          url="${{ vars.SITE_URL || 'https://saheeh.ai' }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url")
          echo "$url -> $code"
          [ "$code" = "200" ] || { echo "::error::Site returned $code"; exit 1; }
