name: Deploy frontend

# Fires only when frontend code actually changes, so a backend-only commit
# does not rebuild and re-upload the site.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Never let two deploys race to the same bucket.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify deploy configuration
        env:
          API_ENDPOINT: ${{ vars.API_ENDPOINT }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=0
          for v in API_ENDPOINT TURNSTILE_SITE_KEY S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Build
        working-directory: frontend
        env:
          CI: true
          REACT_APP_API_ENDPOINT: ${{ vars.API_ENDPOINT }}
          REACT_APP_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-frontend-${{ github.run_id }}

      - name: Upload hashed assets
        # Content-hashed filenames, so they can be cached indefinitely.
        # Uploaded BEFORE index.html so the new HTML never references an
        # asset that has not landed yet.
        working-directory: frontend
        run: |
          aws s3 sync build/ "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.map"

      - name: Upload index.html
        # Never cached: this is the file that points at the new asset hashes.
        working-directory: frontend
        run: |
          aws s3 cp build/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $id created; waiting for completion."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$id"

      - name: Smoke test
        run: |
          url="${{ vars.SITE_URL || 'https://saheeh.ai' }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url")
          echo "$url -> $code"
          [ "$code" = "200" ] || { echo "::error::Site returned $code"; exit 1; }
