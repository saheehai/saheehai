name: CI

# Runs on every PR and on main. This is the check that branch protection
# should require before a merge is allowed.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # CI=true makes react-scripts treat warnings as errors. Keep it that
          # way: a warning that reaches main is a warning nobody will ever fix.
          CI: true
          # A placeholder is enough to compile. The real endpoint is injected
          # only at deploy time, so CI never needs production config.
          REACT_APP_API_ENDPOINT: https://ci.invalid/prod
          REACT_APP_TURNSTILE_SITE_KEY: ci-placeholder-site-key
        run: npm run build

      - name: Guard against hardcoded API endpoints
        # The previous API URL leaked because it was a hardcoded fallback in
        # the source. Fail the build if a real execute-api host reappears.
        run: |
          if grep -rInE 'https://[a-z0-9]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com' \
               frontend/src frontend/public 2>/dev/null; then
            echo "::error::Hardcoded API Gateway endpoint found in source."
            echo "Use the REACT_APP_API_ENDPOINT environment variable instead."
            exit 1
          fi
          echo "No hardcoded API endpoints found."

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend
        id: detect
        run: |
          if [ -d backend ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/ directory yet - skipping backend checks."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          # Match the Lambda runtime so CI exercises the same interpreter.
          python-version: '3.13'

      - name: Install dev dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          pip install ruff pytest

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: ruff check .

      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          if [ -d tests ]; then pytest -q; else echo "No tests/ directory yet."; fi

  template-validation:
    name: Validate CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Lint templates
        run: |
          python -m pip install --upgrade pip cfn-lint
          shopt -s nullglob
          templates=(infra/*.yaml infra/*.yml)
          if [ ${#templates[@]} -eq 0 ]; then
            echo "No templates to validate."
            exit 0
          fi
          # W3002/W3045 fire on SAM-managed local paths and ACL usage, neither
          # of which applies before `sam build` has run.
          cfn-lint "${templates[@]}" --ignore-checks W3002 W3045
