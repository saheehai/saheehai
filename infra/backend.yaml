AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Saheeh AI backend: HTTP API, Lambda, and the request-quota table.
  Deployed alongside the existing console-managed stack rather than importing
  it, so the live site is untouched until DNS/config is pointed at this API.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://saheeh.ai
    Description: >-
      Exact browser origin permitted by CORS. Never "*" - a wildcard is what
      allowed any page on the internet to drive the previous API.

  TurnstileSecret:
    Type: String
    NoEcho: true
    Description: Cloudflare Turnstile secret key, verified server-side.

  TurnstileAction:
    Type: String
    Default: session
    Description: >-
      Action name the widget is rendered with. siteverify echoes it back and
      the handler requires a match, so a token minted for another surface
      cannot be replayed against /session.

  TurnstileAllowedHostnames:
    Type: CommaDelimitedList
    Default: saheeh.ai,www.saheeh.ai,localhost,127.0.0.1
    Description: >-
      Hostnames siteverify may report for a token. Checking this stops a
      token solved on some other host sharing the sitekey from being used.

  OriginVerifySecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Shared secret the site's CloudFront distribution attaches to API
      requests as an x-origin-verify custom origin header. When set, the
      function refuses any request without it, so the CloudFront viewer
      country/region headers it relies on for the geographic restriction
      cannot be forged by calling API Gateway directly. Leave empty until
      the /api/* behavior on the distribution is wired up (see DEPLOYMENT.md).

  GeoBlockUnknown:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Refuse the Experiments when the viewer's country or state cannot be
      determined. Keep false until the API is behind CloudFront, or every
      request is "unknown".

  NewsletterFromAddress:
    Type: String
    Default: ''
    Description: >-
      Verified SES identity the newsletter confirmation email is sent from,
      e.g. "Saheeh AI <news@saheeh.ai>". Leave empty until the domain or
      address is verified in SES and the account is out of the SES sandbox;
      while empty, POST /subscribe answers 503 with a readable message and
      stores nothing.

  SiteUrl:
    Type: String
    Default: https://saheeh.ai
    Description: Where the confirm and unsubscribe links in emails point.

  ChatTableName:
    Type: String
    Default: saheeh_chat_history
    Description: Existing table, referenced rather than managed by this stack.

  JournalTableName:
    Type: String
    Default: saheeh_journal
    Description: Existing table, referenced rather than managed by this stack.

  DailyMessageQuota:
    Type: Number
    Default: 50
    Description: Messages per identity per day, enforced in DynamoDB.

  ChatUserIndexName:
    Type: String
    Default: user-conversations-index
    Description: >-
      Global secondary index on the chat table (hash user_id, range
      timestamp). The chat table is not managed by this stack; the index
      already exists on the live table (DEPLOYMENT.md, "Account routes").
      The function queries it to find one person's conversations for export
      and delete; without it those routes fail, since the function
      deliberately cannot scan the table.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: >-
      The previous log group had no retention, so every chat message and
      journal entry persisted in CloudWatch indefinitely.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 45
    MemorySize: 256
    Architectures: [arm64]

Resources:
  # --- Identity ------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    # Retain on stack delete: this holds real accounts, and a template change
    # that replaced it would silently delete every user.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      # Email is the username. AliasAttributes would let someone sign up with
      # a username that collides with another person's email.
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserAttributeUpdateSettings:
        # Changing an email does not take effect until the new one is
        # verified, so account recovery cannot be redirected to an
        # unverified address.
        AttributesRequireVerificationBeforeUpdate: [email]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        # Consent record, written by the browser at sign-up and required by
        # the PreSignUp trigger: that the person is 18 or older, and the date
        # of the Terms and Privacy Policy they accepted. Immutable so an
        # export shows exactly what was agreed. Custom attributes can be added
        # to a live pool but never renamed or removed, so these names are
        # final. Adding them is an in-place update, not a replacement; check
        # the change set says Modify before deploying.
        - Name: age_attested
          AttributeDataType: String
          Mutable: false
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '8'
        - Name: policies_accepted
          AttributeDataType: String
          Mutable: false
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '16'
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-web'
      UserPoolId: !Ref UserPool
      # No client secret: this runs in a browser, where a secret is not secret.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes: [email, email_verified, 'custom:age_attested', 'custom:policies_accepted']
      WriteAttributes: [email, 'custom:age_attested', 'custom:policies_accepted']

  # Gates account creation on a Turnstile challenge. Sign-up goes from the
  # browser straight to Cognito, so this trigger is the only place a
  # server-side check can run - without it, accounts can be minted in bulk
  # and the per-account quota means nothing.
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-presignup'
      CodeUri: ../backend/
      Handler: presignup.lambda_handler
      Description: Verifies a Turnstile token before allowing sign-up.
      Timeout: 10
      Environment:
        Variables:
          TURNSTILE_SECRET: !Ref TurnstileSecret
          TURNSTILE_ACTION: signup
          TURNSTILE_ALLOWED_HOSTNAMES: !Join [',', !Ref TurnstileAllowedHostnames]

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-presignup'
      RetentionInDays: !Ref LogRetentionDays

  # --- API -----------------------------------------------------------------

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Tokens are validated by API Gateway itself, so an unauthenticated or
      # tampered request never reaches the function.
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [content-type, authorization]
        AllowMethods: [GET, POST, OPTIONS]
        AllowCredentials: false
        MaxAge: 300
      # A blunt backstop beneath the per-identity quota. AWS WAF cannot be
      # attached to an HTTP API (it supports REST APIs, CloudFront, and ALB
      # only), so stage throttling is the equivalent control here.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
        DetailedMetricsEnabled: true
      # Audit trail: who called what, when, from where, with what result.
      # Deliberately no request or response body, so the log holds no chat
      # or journal content. `user` is the Cognito subject, never an email.
      # HIPAA 45 CFR 164.312(b) calls this "audit controls"; it is also
      # what lets an abuse report be traced to an account.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","time":"$context.requestTime",
          "ip":"$context.identity.sourceIp","userAgent":"$context.identity.userAgent",
          "user":"$context.authorizer.claims.sub","method":"$context.httpMethod",
          "route":"$context.routeKey","status":"$context.status",
          "latencyMs":"$context.responseLatency","bytes":"$context.responseLength",
          "error":"$context.error.message","authError":"$context.authorizer.error"}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-access'
      RetentionInDays: !Ref LogRetentionDays

  # --- Function ------------------------------------------------------------

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ../backend/
      Handler: lambda_function.lambda_handler
      Description: Saheeh AI chat, journal and account API.
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          CHAT_TABLE: !Ref ChatTableName
          CHAT_USER_INDEX: !Ref ChatUserIndexName
          JOURNAL_TABLE: !Ref JournalTableName
          QUOTA_TABLE: !Ref QuotaTable
          PROFILE_TABLE: !Ref ProfileTable
          DAILY_MESSAGE_QUOTA: !Ref DailyMessageQuota
          ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
          GEO_BLOCK_UNKNOWN: !Ref GeoBlockUnknown
      Events:
        Chat:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /chat, Method: POST }
        JournalSave:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /journal, Method: POST }
        JournalList:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /journal, Method: GET }
        # The Account page: nickname and picture, and the self-service side
        # of the Privacy Policy's export and delete promises.
        ProfileGet:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /profile, Method: GET }
        ProfileSave:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /profile, Method: POST }
        AccountExport:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /account/export, Method: GET }
        AccountDeleteData:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /account/delete-data, Method: POST }
        AccountDelete:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /account/delete, Method: POST }
        # The same routes under /api, which is the prefix the site's
        # CloudFront distribution forwards; the handler strips it.
        ApiChat:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/chat, Method: POST }
        ApiJournalSave:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/journal, Method: POST }
        ApiJournalList:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/journal, Method: GET }
        ApiProfileGet:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/profile, Method: GET }
        ApiProfileSave:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/profile, Method: POST }
        ApiAccountExport:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/account/export, Method: GET }
        ApiAccountDeleteData:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/account/delete-data, Method: POST }
        ApiAccountDelete:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/account/delete, Method: POST }
      Policies:
        # Scoped deliberately. The previous role carried BedrockFullAccess,
        # BedrockMarketplaceAccess, and three DynamoDB full-access policies.
        #
        # Delete is allowed because the Account page lets a person delete
        # their own rows, and only ever the rows under their own subject
        # (account.py). Scan is still absent: one person's conversations are
        # found through the chat table's user index, never by reading the
        # table. Cognito is still absent: the browser removes the Cognito
        # user itself, with the person's own session, after the rows are gone.
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeOneModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-120b-1:0'
            - Sid: ReadWriteOwnTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JournalTableName}'
                - !GetAtt QuotaTable.Arn
                - !GetAtt ProfileTable.Arn
            - Sid: FindOwnConversations
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatTableName}/index/${ChatUserIndexName}'

  # Declared explicitly so retention is set. An implicitly created log group
  # never expires, which is how the old one accumulated user content forever.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !Ref LogRetentionDays

  # --- Newsletter ----------------------------------------------------------

  # The only unauthenticated routes on the API. Its own function, so a bug
  # here cannot reach the chat and journal tables, and its own Turnstile
  # action, so a token solved for sign-up cannot be replayed here or vice
  # versa. Nothing in it is geo-restricted: an email list is not an
  # AI-delivered mental health service.
  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-subscribe'
      CodeUri: ../backend/
      Handler: subscribe.lambda_handler
      Description: Newsletter sign-up with double opt-in, and unsubscribe.
      Timeout: 15
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SUBSCRIBER_TABLE: !Ref SubscriberTable
          NEWSLETTER_FROM: !Ref NewsletterFromAddress
          SITE_URL: !Ref SiteUrl
          TURNSTILE_SECRET: !Ref TurnstileSecret
          TURNSTILE_ACTION: subscribe
          TURNSTILE_ALLOWED_HOSTNAMES: !Join [',', !Ref TurnstileAllowedHostnames]
      Events:
        Subscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /subscribe, Method: POST, Auth: { Authorizer: NONE } }
        Confirm:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /subscribe/confirm, Method: GET, Auth: { Authorizer: NONE } }
        Unsubscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /subscribe/unsubscribe, Method: GET, Auth: { Authorizer: NONE } }
        ApiSubscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/subscribe, Method: POST, Auth: { Authorizer: NONE } }
        ApiConfirm:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/subscribe/confirm, Method: GET, Auth: { Authorizer: NONE } }
        ApiUnsubscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/subscribe/unsubscribe, Method: GET, Auth: { Authorizer: NONE } }
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: SubscriberTable
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt SubscriberTable.Arn
                - !Sub '${SubscriberTable.Arn}/index/by_token'
            - Sid: SendFromOurIdentitiesOnly
              Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'

  SubscribeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-subscribe'
      RetentionInDays: !Ref LogRetentionDays

  # --- Edge ----------------------------------------------------------------

  # Policies for the /api/* behavior on the site's CloudFront distribution.
  # The distribution itself is console-managed, so the behavior is attached
  # by hand (DEPLOYMENT.md, "Putting the API behind CloudFront"); these two
  # policies are what it is attached with. Routing the API through the edge
  # is what gives the function CloudFront's viewer country and state headers
  # for the geographic restriction, and it makes API calls same-origin.

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-api-no-cache'
        Comment: API responses are never cached; Authorization must be forwarded.
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          # CloudFront drops Authorization on GET/HEAD unless the cache
          # policy names it. Listing it here is what lets GET /journal work.
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-api-origin'
        Comment: Forward the viewer's country and state, never the Host header.
        HeadersConfig:
          HeaderBehavior: whitelist
          # Host is deliberately absent: API Gateway routes on its own host.
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-Country-Region
            - Content-Type
            - Origin
            - Accept
            - User-Agent
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  # --- Storage -------------------------------------------------------------

  # Only the quota table is created here. The chat and journal tables already
  # exist and hold live data, so they are referenced by name; importing them
  # is a separate, deliberate step.
  QuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-quota'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quota_key
          AttributeType: S
      KeySchema:
        - AttributeName: quota_key
          KeyType: HASH
      # Spent windows delete themselves; nothing here is worth keeping.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # One row per account: a nickname and a small picture, both optional, both
  # shown only to their owner. The picture is stored inline as a data URL the
  # browser produced (about 10 KB), so there is no bucket, no public URL,
  # and nothing outside this row to wipe when the account goes. Retained on
  # stack delete like the user pool: it holds what people chose to be called.
  ProfileTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-profiles'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Newsletter addresses. Keyed by address so a repeat sign-up is an update,
  # with an index on the emailed token so confirm and unsubscribe links can
  # be resolved without a scan. Unsubscribing sets expires_at 30 days out
  # and the row deletes itself, which is what the Privacy Policy promises.
  SubscriberTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-subscribers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by_token
          KeySchema:
            - AttributeName: token
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  ApiEndpoint:
    Description: >-
      Base URL for the API. Set this as the API_ENDPOINT repository variable.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-api-endpoint'

  UserPoolId:
    Description: Set as the REACT_APP_COGNITO_USER_POOL_ID repository variable.
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Set as the REACT_APP_COGNITO_CLIENT_ID repository variable.
    Value: !Ref UserPoolClient

  FunctionName:
    Value: !Ref ApiFunction

  ApiOriginDomain:
    Description: Origin domain for the /api/* CloudFront behavior.
    Value: !Sub '${Api}.execute-api.${AWS::Region}.amazonaws.com'

  ApiCachePolicyId:
    Value: !Ref ApiCachePolicy

  ApiOriginRequestPolicyId:
    Value: !Ref ApiOriginRequestPolicy

  QuotaTableName:
    Value: !Ref QuotaTable

  SubscriberTableName:
    Value: !Ref SubscriberTable

  ProfileTableName:
    Value: !Ref ProfileTable
