AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Saheeh AI backend: HTTP API, Lambda, and the request-quota table.
  Deployed alongside the existing console-managed stack rather than importing
  it, so the live site is untouched until DNS/config is pointed at this API.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://saheeh.ai
    Description: >-
      Exact browser origin permitted by CORS. Never "*" - a wildcard is what
      allowed any page on the internet to drive the previous API.

  TurnstileSecret:
    Type: String
    NoEcho: true
    Description: Cloudflare Turnstile secret key, verified server-side.

  TurnstileAction:
    Type: String
    Default: session
    Description: >-
      Action name the widget is rendered with. siteverify echoes it back and
      the handler requires a match, so a token minted for another surface
      cannot be replayed against /session.

  TurnstileAllowedHostnames:
    Type: CommaDelimitedList
    Default: saheeh.ai,www.saheeh.ai,localhost,127.0.0.1
    Description: >-
      Hostnames siteverify may report for a token. Checking this stops a
      token solved on some other host sharing the sitekey from being used.

  OriginVerifySecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Shared secret the site's CloudFront distribution attaches to API
      requests as an x-origin-verify custom origin header. When set, the
      function refuses any request without it, so the CloudFront viewer
      country/region headers it relies on for the geographic restriction
      cannot be forged by calling API Gateway directly. Leave empty until
      the /api/* behavior on the distribution is wired up (see DEPLOYMENT.md).

  GeoBlockUnknown:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Refuse the Experiments when the viewer's country or state cannot be
      determined. Keep false until the API is behind CloudFront, or every
      request is "unknown".

  ChatTableName:
    Type: String
    Default: saheeh_chat_history
    Description: Existing table, referenced rather than managed by this stack.

  JournalTableName:
    Type: String
    Default: saheeh_journal
    Description: Existing table, referenced rather than managed by this stack.

  DailyMessageQuota:
    Type: Number
    Default: 50
    Description: Messages per identity per day, enforced in DynamoDB.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: >-
      The previous log group had no retention, so every chat message and
      journal entry persisted in CloudWatch indefinitely.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 45
    MemorySize: 256
    Architectures: [arm64]

Resources:
  # --- Identity ------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    # Retain on stack delete: this holds real accounts, and a template change
    # that replaced it would silently delete every user.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      # Email is the username. AliasAttributes would let someone sign up with
      # a username that collides with another person's email.
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserAttributeUpdateSettings:
        # Changing an email does not take effect until the new one is
        # verified, so account recovery cannot be redirected to an
        # unverified address.
        AttributesRequireVerificationBeforeUpdate: [email]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-web'
      UserPoolId: !Ref UserPool
      # No client secret: this runs in a browser, where a secret is not secret.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes: [email, email_verified]
      WriteAttributes: [email]

  # Gates account creation on a Turnstile challenge. Sign-up goes from the
  # browser straight to Cognito, so this trigger is the only place a
  # server-side check can run - without it, accounts can be minted in bulk
  # and the per-account quota means nothing.
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-presignup'
      CodeUri: ../backend/
      Handler: presignup.lambda_handler
      Description: Verifies a Turnstile token before allowing sign-up.
      Timeout: 10
      Environment:
        Variables:
          TURNSTILE_SECRET: !Ref TurnstileSecret
          TURNSTILE_ACTION: signup
          TURNSTILE_ALLOWED_HOSTNAMES: !Join [',', !Ref TurnstileAllowedHostnames]

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-presignup'
      RetentionInDays: !Ref LogRetentionDays

  # --- API -----------------------------------------------------------------

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Tokens are validated by API Gateway itself, so an unauthenticated or
      # tampered request never reaches the function.
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [content-type, authorization]
        AllowMethods: [GET, POST, OPTIONS]
        AllowCredentials: false
        MaxAge: 300
      # A blunt backstop beneath the per-identity quota. AWS WAF cannot be
      # attached to an HTTP API (it supports REST APIs, CloudFront, and ALB
      # only), so stage throttling is the equivalent control here.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
        DetailedMetricsEnabled: true
      # Audit trail: who called what, when, from where, with what result.
      # Deliberately no request or response body, so the log holds no chat
      # or journal content. `user` is the Cognito subject, never an email.
      # HIPAA 45 CFR 164.312(b) calls this "audit controls"; it is also
      # what lets an abuse report be traced to an account.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","time":"$context.requestTime",
          "ip":"$context.identity.sourceIp","userAgent":"$context.identity.userAgent",
          "user":"$context.authorizer.claims.sub","method":"$context.httpMethod",
          "route":"$context.routeKey","status":"$context.status",
          "latencyMs":"$context.responseLatency","bytes":"$context.responseLength",
          "error":"$context.error.message","authError":"$context.authorizer.error"}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-access'
      RetentionInDays: !Ref LogRetentionDays

  # --- Function ------------------------------------------------------------

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ../backend/
      Handler: lambda_function.lambda_handler
      Description: Saheeh AI chat and journal API.
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          CHAT_TABLE: !Ref ChatTableName
          JOURNAL_TABLE: !Ref JournalTableName
          QUOTA_TABLE: !Ref QuotaTable
          DAILY_MESSAGE_QUOTA: !Ref DailyMessageQuota
          ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
          GEO_BLOCK_UNKNOWN: !Ref GeoBlockUnknown
      Events:
        Chat:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /chat, Method: POST }
        JournalSave:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /journal, Method: POST }
        JournalList:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /journal, Method: GET }
        # The same routes under /api, which is the prefix the site's
        # CloudFront distribution forwards; the handler strips it.
        ApiChat:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/chat, Method: POST }
        ApiJournalSave:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/journal, Method: POST }
        ApiJournalList:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/journal, Method: GET }
      Policies:
        # Scoped deliberately. The previous role carried BedrockFullAccess,
        # BedrockMarketplaceAccess, and three DynamoDB full-access policies.
        - Version: '2012-10-17'
          Statement:
            - Sid: InvokeOneModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-120b-1:0'
            - Sid: ReadWriteOwnTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatTableName}'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JournalTableName}'
                - !GetAtt QuotaTable.Arn

  # Declared explicitly so retention is set. An implicitly created log group
  # never expires, which is how the old one accumulated user content forever.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !Ref LogRetentionDays

  # --- Edge ----------------------------------------------------------------

  # Policies for the /api/* behavior on the site's CloudFront distribution.
  # The distribution itself is console-managed, so the behavior is attached
  # by hand (DEPLOYMENT.md, "Putting the API behind CloudFront"); these two
  # policies are what it is attached with. Routing the API through the edge
  # is what gives the function CloudFront's viewer country and state headers
  # for the geographic restriction, and it makes API calls same-origin.

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-api-no-cache'
        Comment: API responses are never cached; Authorization must be forwarded.
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          # CloudFront drops Authorization on GET/HEAD unless the cache
          # policy names it. Listing it here is what lets GET /journal work.
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-api-origin'
        Comment: Forward the viewer's country and state, never the Host header.
        HeadersConfig:
          HeaderBehavior: whitelist
          # Host is deliberately absent: API Gateway routes on its own host.
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-Country-Region
            - Content-Type
            - Origin
            - Accept
            - User-Agent
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  # --- Storage -------------------------------------------------------------

  # Only the quota table is created here. The chat and journal tables already
  # exist and hold live data, so they are referenced by name; importing them
  # is a separate, deliberate step.
  QuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-quota'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quota_key
          AttributeType: S
      KeySchema:
        - AttributeName: quota_key
          KeyType: HASH
      # Spent windows delete themselves; nothing here is worth keeping.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

Outputs:
  ApiEndpoint:
    Description: >-
      Base URL for the API. Set this as the API_ENDPOINT repository variable.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-api-endpoint'

  UserPoolId:
    Description: Set as the REACT_APP_COGNITO_USER_POOL_ID repository variable.
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Set as the REACT_APP_COGNITO_CLIENT_ID repository variable.
    Value: !Ref UserPoolClient

  FunctionName:
    Value: !Ref ApiFunction

  ApiOriginDomain:
    Description: Origin domain for the /api/* CloudFront behavior.
    Value: !Sub '${Api}.execute-api.${AWS::Region}.amazonaws.com'

  ApiCachePolicyId:
    Value: !Ref ApiCachePolicy

  ApiOriginRequestPolicyId:
    Value: !Ref ApiOriginRequestPolicy

  QuotaTableName:
    Value: !Ref QuotaTable
